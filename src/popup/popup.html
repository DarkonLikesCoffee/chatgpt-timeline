<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatGPT Activity Timeline</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>ChatGPT Activity Timeline</h1>
  <p id="status" class="status">Loading…</p>
  <dl id="stats"></dl>
  <button id="open" class="primary">Open timeline</button>
  <button id="pause"></button>
  <section class="diag">
    <h2>This tab</h2>
    <ul id="tabStatus"><li class="muted">Checking…</li></ul>
    <button id="copyDiag" hidden>Copy diagnostics</button>
    <button id="saveDiag" hidden>Save diagnostics file</button>
    <p id="copied" class="muted" hidden>Copied. The diagnostics contain page structure and counters only, no message text.</p>
  </section>
  <p class="muted">Records only when you send a message and when a response finishes on chatgpt.com. No message text. Stored locally.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
