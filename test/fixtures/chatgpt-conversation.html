<!doctype html>
<html>
<head><title>Refactoring the parser</title></head>
<body>
  <nav>
    <a href="/c/68f1a2b3-0000-8000-9999-000000000001">Refactoring the parser</a>
    <a href="/c/68f1a2b3-0000-8000-9999-000000000002">Other chat</a>
  </nav>
  <main>
    <div class="thread">
      <article data-testid="conversation-turn-1">
        <div data-message-author-role="user" data-message-id="u-1"><div class="whitespace-pre-wrap">Hello there</div></div>
      </article>
      <article data-testid="conversation-turn-2">
        <div data-message-author-role="assistant" data-message-id="a-1" data-message-model-slug="gpt-5"><div class="markdown prose">Hi! How can I help?</div></div>
        <div><button data-testid="copy-turn-action-button">Copy</button></div>
      </article>
      <article data-testid="conversation-turn-3">
        <div data-message-author-role="user" data-message-id="u-2"><div class="whitespace-pre-wrap">Use a tool</div></div>
      </article>
      <article data-testid="conversation-turn-4">
        <div data-message-author-role="assistant" data-message-id="a-2"><div class="markdown">Searching…</div></div>
        <div data-message-author-role="tool" data-message-id="t-1"><div>tool output</div></div>
        <div data-message-author-role="assistant" data-message-id="a-3"><div class="markdown result-streaming">Partial answer</div></div>
      </article>
    </div>
    <form>
      <div id="prompt-textarea" contenteditable="true" class="ProseMirror"><p>draft text</p></div>
      <button data-testid="stop-button" aria-label="Stop streaming"></button>
    </form>
  </main>
</body>
</html>
